groups:
  - name: microservices
    rules:
      - alert: UserServiceDependencyUnavailable
        expr: sum(rate(http_server_requests_seconds_count{status="503"}[5m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: User Service cannot reach Order Service
      - alert: OrderServiceHighErrorRate
        expr: sum(rate(http_requests_total{service="order-service",status="500"}[5m])) / clamp_min(sum(rate(http_requests_total{service="order-service"}[5m])), 1) > 0.15
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Order Service HTTP 500 rate is elevated
      - alert: OrderServiceLatencyDegraded
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="order-service"}[5m])) by (le)) > 3
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Order Service p95 latency exceeds normal mode
      - alert: TelemetryPipelineUnavailable
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: OpenTelemetry Collector is unavailable
