openapi: 3.0.3
info:
  title: User Service API
  version: 1.0.0
paths:
  /users:
    get:
      summary: Retrieve sample users with order context
      responses:
        '200':
          description: Users and their order summaries
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required: [id, name, orders]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        orders:
                          type: array
                          items: { $ref: '#/components/schemas/Order' }
        '503':
          description: Order Service is unavailable or timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Order:
      type: object
      required: [id, userId, description, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        description: { type: string }
        amount: { type: number, format: double, minimum: 0 }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: ORDER_SERVICE_UNAVAILABLE }
        message: { type: string }
