openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
paths:
  /orders:
    get:
      summary: Retrieve sample orders
      responses:
        '200':
          description: Configured sample orders, which may be empty
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '500':
          description: Injected error when anomaly mode is error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: PostgreSQL is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Order:
      type: object
      required: [id, userId, description, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        description: { type: string }
        amount: { type: number, format: double, minimum: 0 }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
